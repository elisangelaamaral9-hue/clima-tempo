<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Verifique a previsão do tempo para cidades usando APIs públicas (Open-Meteo).">
  <meta name="theme-color" content="#0077b6">
  <title>Clima Tempo</title>
  <link rel="stylesheet" href="web/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <main id="main">
    <div class="app-container">
    <header>
      <h1>☁️ Clima Tempo</h1>
      <p>Verifique a previsão em qualquer lugar</p>
    </header>

    <form id="searchForm" class="search-box">
      <label for="cityInput" class="sr-only">Nome da cidade</label>
      <input type="text" id="cityInput" placeholder="Digite o nome da cidade..." autocomplete="off" aria-label="Cidade">
      <button type="submit" aria-label="Buscar cidade">Buscar</button>
      <button type="button" id="btnLoc" class="btn-icon" aria-label="Usar minha localização" title="Usar minha localização"><i class="fas fa-location-crosshairs"></i></button>
    </form>

    <div id="error" class="message-box hidden" role="status" aria-live="polite" aria-atomic="true"></div>

    <section id="result" class="result-box hidden">
      <h2 id="location"></h2>
      <div id="current" class="weather-details"></div>
      <div id="forecast"></div>
    </section>

    <footer class="app-footer">
      <div class="social-links">
        <a href="https://www.linkedin.com/in/elisangela-amaral/" target="_blank" rel="noopener noreferrer" title="LinkedIn">
          <i class="fab fa-linkedin"></i>
        </a>
        <a href="https://github.com/elisangelaamaral9-hue" target="_blank" rel="noopener noreferrer" title="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://www.instagram.com/elisangela.amaral24" target="_blank" rel="noopener noreferrer" title="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
      </div>
      <p>Feito por Elisângela Amaral - 2025</p>
    </footer>
    </div>
  </main>

  <script src="web/js/app.js" defer></script>
</body>
</html>
